<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 1. ground shadow -->
  <ellipse cx="256" cy="497" rx="138" ry="14" fill="#3B2E2A" opacity="0.10"/>

  <!-- 2. tail -->
  <path d="M396 340 C 445 330 465 300 452 268" fill="none" stroke="#3B2E2A" stroke-width="11" stroke-linecap="round"/>
  <ellipse cx="450" cy="258" rx="15" ry="20" fill="#4E403A" stroke="#3B2E2A" stroke-width="11" transform="rotate(15 450 258)"/>

  <!-- 3. ears (behind head) -->
  <g stroke="#3B2E2A" stroke-width="11" stroke-linejoin="round">
    <ellipse cx="132" cy="118" rx="46" ry="28" fill="#FFF9F0" transform="rotate(-28 132 118)"/>
    <ellipse cx="380" cy="118" rx="46" ry="28" fill="#FFF9F0" transform="rotate(28 380 118)"/>
  </g>
  <ellipse cx="138" cy="122" rx="24" ry="13" fill="#F7B8B4" transform="rotate(-28 138 122)"/>
  <ellipse cx="374" cy="122" rx="24" ry="13" fill="#F7B8B4" transform="rotate(28 374 122)"/>

  <!-- 3b. horns (behind head) -->
  <path d="M196 86 C 188 54 202 32 224 38 C 244 44 246 68 234 90 Z" fill="#F2E5C9" stroke="#3B2E2A" stroke-width="11" stroke-linejoin="round"/>
  <path d="M316 86 C 324 54 310 32 288 38 C 268 44 266 68 278 90 Z" fill="#F2E5C9" stroke="#3B2E2A" stroke-width="11" stroke-linejoin="round"/>

  <defs>
    <clipPath id="bodyClip"><ellipse cx="256" cy="380" rx="150" ry="108"/></clipPath>
    <clipPath id="headClip"><ellipse cx="256" cy="196" rx="136" ry="124"/></clipPath>
  </defs>

  <!-- 4. body fill pass -->
  <ellipse cx="256" cy="380" rx="150" ry="108" fill="#FFF9F0"/>

  <!-- 5. body spots clipped -->
  <g clip-path="url(#bodyClip)">
    <path d="M300 300 q 90 -20 110 60 q 10 70 -60 90 q -80 10 -95 -60 q -5 -70 45 -90 z" fill="#4E403A"/>
    <path d="M130 350 q 40 -15 55 25 q 10 40 -25 50 q -40 5 -50 -30 q -5 -35 20 -45 z" fill="#4E403A"/>
  </g>

  <!-- 6. body stroke pass -->
  <ellipse cx="256" cy="380" rx="150" ry="108" fill="none" stroke="#3B2E2A" stroke-width="11"/>

  <!-- 7. legs + hooves -->
  <rect x="170" y="440" width="52" height="64" rx="24" fill="#FFF9F0" stroke="#3B2E2A" stroke-width="11"/>
  <rect x="290" y="440" width="52" height="64" rx="24" fill="#FFF9F0" stroke="#3B2E2A" stroke-width="11"/>
  <rect x="178" y="476" width="36" height="20" rx="10" fill="#4E403A"/>
  <rect x="298" y="476" width="36" height="20" rx="10" fill="#4E403A"/>

  <!-- 8. head fill pass -->
  <ellipse cx="256" cy="196" rx="136" ry="124" fill="#FFF9F0"/>

  <!-- 8b. head patch clipped -->
  <g clip-path="url(#headClip)">
    <path d="M292 96 Q 340 84 356 118 Q 364 148 330 154 Q 288 158 280 128 Q 276 100 292 96 Z" fill="#4E403A"/>
  </g>

  <!-- 8c. head stroke pass -->
  <ellipse cx="256" cy="196" rx="136" ry="124" fill="none" stroke="#3B2E2A" stroke-width="11"/>

  <!-- 9. muzzle + nostrils + mouth -->
  <ellipse cx="256" cy="262" rx="86" ry="58" fill="#FFDCCF" stroke="#3B2E2A" stroke-width="11"/>
  <ellipse cx="228" cy="258" rx="10" ry="13" fill="#F7A8A0"/>
  <ellipse cx="284" cy="258" rx="10" ry="13" fill="#F7A8A0"/>
  <path d="M242 292 Q 256 302 270 292" fill="none" stroke="#3B2E2A" stroke-width="8" stroke-linecap="round"/>

  <!-- 10. eyes + blush -->
  <circle cx="192" cy="188" r="13" fill="#3B2E2A"/>
  <circle cx="320" cy="188" r="13" fill="#3B2E2A"/>
  <circle cx="196" cy="183" r="4.5" fill="#FFFFFF"/>
  <circle cx="324" cy="183" r="4.5" fill="#FFFFFF"/>
  <ellipse cx="150" cy="228" rx="17" ry="11" fill="#F7A8A0" opacity="0.55"/>
  <ellipse cx="362" cy="228" rx="17" ry="11" fill="#F7A8A0" opacity="0.55"/>
</svg>
